<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AstroSphere Pro | Simulador</title>
  <style>
    :root {
      --primary-cyan: #00f2fe;
      --bg-dark: #030712;
      --text-main: #f8fafc;
      --glass-bg: rgba(15, 23, 42, 0.9);
      --border-glass: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-dark); color: var(--text-main); }
    .deep-space-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at center, #0f172a 0%, #030712 100%); }
    
    .top-control-bar {
      position: fixed; top: 0; left: 0; width: 100%;
      background: rgba(5, 8, 20, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-glass);
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 15px; z-index: 100; gap: 10px;
    }
    .hud-brand { display: flex; align-items: center; gap: 8px; }
    .brand-title { font-size: 15px; font-weight: 700; }
    .highlight { color: var(--primary-cyan); }
    
    .hud-controls-deck { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .hud-group { display: flex; flex-direction: column; gap: 2px; }
    .hud-label { font-size: 10px; color: #cbd5e1; }
    
    .cyber-select, .cyber-btn {
      background: rgba(30, 41, 59, 0.9); border: 1px solid var(--border-glass);
      color: var(--text-main); padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; outline: none;
    }
    .cyber-btn.active { background: rgba(0, 242, 254, 0.15); border-color: var(--primary-cyan); color: var(--primary-cyan); }
    .cyber-range { accent-color: var(--primary-cyan); cursor: pointer; height: 4px; width: 80px; }
    .hud-actions { display: flex; gap: 5px; }

    .simulation-viewport { width: 100%; height: 100vh; }
    canvas { display: block; touch-action: none; }

    .info-modal {
      position: fixed; bottom: 15px; right: 15px; width: 320px; max-height: 80vh;
      background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-glass);
      border-radius: 12px; padding: 15px; z-index: 200; box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      overflow-y: auto;
    }
    .info-modal.hidden { display: none !important; }
    .close-btn { position: absolute; top: 10px; right: 10px; background: none; border: none; color: #94a3b8; font-size: 18px; cursor: pointer; }
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
    .stat-box { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.05); padding: 8px; border-radius: 6px; }
    .stat-box.full-width { grid-column: span 2; }
    .stat-box .label { display: block; font-size: 10px; color: #94a3b8; }
    .stat-box strong { font-size: 12px; color: var(--primary-cyan); }

    @media screen and (max-width: 900px) {
      body, html { overflow: auto; }
      .top-control-bar { position: relative; flex-direction: column; align-items: stretch; }
      .hud-controls-deck { flex-direction: column; width: 100%; }
      .hud-group, .cyber-select, .cyber-range, .hud-actions, .cyber-btn { width: 100%; }
      .simulation-viewport { height: 65vh; }
      .info-modal { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); width: 95% !important; }
    }
  </style>
</head>
<body>

  <div class="deep-space-bg"></div>

  <header class="top-control-bar">
    <div class="hud-brand">
      <span>🪐</span>
      <span class="brand-title">ASTRO<span class="highlight">SIM</span></span>
    </div>
    <div class="hud-controls-deck">
      <div class="hud-group">
        <span class="hud-label">Enfocar Cuerpo</span>
        <select id="planetSelect" class="cyber-select">
          <option value="all">Vista General</option>
          <option value="sun">El Sol</option>
          <option value="mercury">Mercurio</option>
          <option value="venus">Venus</option>
          <option value="earth">Tierra</option>
          <option value="mars">Marte</option>
          <option value="jupiter">Júpiter</option>
          <option value="saturn">Saturno</option>
          <option value="uranus">Urano</option>
          <option value="neptune">Neptuno</option>
        </select>
      </div>
      <div class="hud-group">
        <span class="hud-label">Velocidad</span>
        <input type="range" id="speedRange" min="0.1" max="5" step="0.1" value="1" class="cyber-range">
      </div>
      <div class="hud-group">
        <span class="hud-label">Inclinación</span>
        <input type="range" id="tiltRange" min="20" max="80" value="50" class="cyber-range">
      </div>
      <div class="hud-actions">
        <button id="pausePlayBtn" class="cyber-btn active">⏸️ Pausa</button>
        <button id="toggleOrbitsBtn" class="cyber-btn active">🌐 Órbitas</button>
      </div>
    </div>
  </header>

  <main class="simulation-viewport">
    <canvas id="solarCanvas"></canvas>
  </main>

  <aside id="infoModal" class="info-modal hidden">
    <button id="closeModal" class="close-btn">&times;</button>
    <h2 id="modalTitle" style="font-size: 16px; margin-bottom: 5px;">Planeta</h2>
    <p id="modalDesc" style="font-size: 12px; color: #94a3b8; margin-bottom: 10px;"></p>
    <div class="stats-grid">
      <div class="stat-box"><span class="label">Diámetro</span><strong id="statDia">0</strong></div>
      <div class="stat-box"><span class="label">Distancia</span><strong id="statDist">0</strong></div>
      <div class="stat-box"><span class="label">Órbita</span><strong id="statOrb">0</strong></div>
      <div class="stat-box"><span class="label">Temperatura</span><strong id="statTemp">0</strong></div>
      <div class="stat-box full-width"><span class="label">Composición</span><strong id="statComp">-</strong></div>
    </div>
  </aside>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('solarCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      const celestialObjects = [
        { id: 'sun', name: 'El Sol', baseColor: '#ffaa00', radius: 45, distance: 0, speed: 0, angle: 0, desc: 'Estrella central del sistema solar.', dia: '1,392,700 km', dist: '0 AU', orb: 'N/A', temp: '5,500 °C', comp: 'Hidrógeno y Helio' },
        { id: 'mercury', name: 'Mercurio', baseColor: '#9ca3af', radius: 8, distance: 90, speed: 0.03, angle: Math.random() * 6, desc: 'Planeta más cercano al Sol.', dia: '4,879 km', dist: '0.39 AU', orb: '88 días', temp: '167 °C', comp: 'Hierro y silicatos' },
        { id: 'venus', name: 'Venus', baseColor: '#facc15', radius: 12, distance: 135, speed: 0.02, angle: Math.random() * 6, desc: 'Mundo rocoso con efecto invernadero.', dia: '12,104 km', dist: '0.72 AU', orb: '225 días', temp: '464 °C', comp: 'Dióxido de carbono' },
        { id: 'earth', name: 'Tierra', baseColor: '#38bdf8', radius: 14, distance: 185, speed: 0.015, angle: Math.random() * 6, desc: 'Nuestro hogar, alberga vida.', dia: '12,742 km', dist: '1.00 AU', orb: '365 días', temp: '15 °C', comp: 'Nitrógeno, Oxígeno, Agua' },
        { id: 'mars', name: 'Marte', baseColor: '#f87171', radius: 10, distance: 240, speed: 0.011, angle: Math.random() * 6, desc: 'El Planeta Rojo.', dia: '6,779 km', dist: '1.52 AU', orb: '687 días', temp: '-65 °C', comp: 'Dióxido de carbono' },
        { id: 'jupiter', name: 'Júpiter', baseColor: '#fb923c', radius: 24, distance: 320, speed: 0.007, angle: Math.random() * 6, desc: 'Gigante gaseoso.', dia: '139,820 km', dist: '5.20 AU', orb: '11.8 años', temp: '-110 °C', comp: 'Hidrógeno y Helio' },
        { id: 'saturn', name: 'Saturno', baseColor: '#fde047', radius: 20, distance: 400, speed: 0.0048, angle: Math.random() * 6, desc: 'Famoso por sus anillos.', dia: '116,460 km', dist: '9.58 AU', orb: '29.5 años', temp: '-140 °C', comp: 'Hidrógeno y Hielo' },
        { id: 'uranus', name: 'Urano', baseColor: '#2dd4bf', radius: 16, distance: 480, speed: 0.003, angle: Math.random() * 6, desc: 'Gigante helado.', dia: '50,724 km', dist: '19.2 AU', orb: '84 años', temp: '-195 °C', comp: 'Agua y metano' },
        { id: 'neptune', name: 'Neptuno', baseColor: '#60a5fa', radius: 15, distance: 550, speed: 0.002, angle: Math.random() * 6, desc: 'Mundo azul tempestuoso.', dia: '49,244 km', dist: '30.0 AU', orb: '165 años', temp: '-200 °C', comp: 'Metano y amoníaco' }
      ];

      let isRunning = true;
      let showOrbits = true;
      let speedMultiplier = 1.0;
      let tiltFactor = 0.50;
      let selectedPlanetId = 'all';

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        // Sol
        ctx.beginPath();
        ctx.arc(centerX, centerY, celestialObjects[0].radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ffaa00';
        ctx.shadowBlur = 30;
        ctx.shadowColor = '#ff4400';
        ctx.fill();
        ctx.shadowBlur = 0;

        // Planetas
        for (let i = 1; i < celestialObjects.length; i++) {
          const p = celestialObjects[i];

          if (showOrbits) {
            ctx.beginPath();
            ctx.ellipse(centerX, centerY, p.distance, p.distance * tiltFactor, 0, 0, Math.PI * 2);
            ctx.strokeStyle = selectedPlanetId === p.id ? 'rgba(0, 242, 254, 0.8)' : 'rgba(255, 255, 255, 0.08)';
            ctx.lineWidth = selectedPlanetId === p.id ? 2 : 1;
            ctx.stroke();
          }

          const x = centerX + Math.cos(p.angle) * p.distance;
          const y = centerY + Math.sin(p.angle) * (p.distance * tiltFactor);
          p.currentX = x;
          p.currentY = y;

          ctx.beginPath();
          ctx.arc(x, y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.baseColor;
          ctx.shadowBlur = 10;
          ctx.shadowColor = p.baseColor;
          ctx.fill();
          ctx.shadowBlur = 0;

          ctx.fillStyle = '#f8fafc';
          ctx.font = '11px system-ui';
          ctx.fillText(p.name, x + p.radius + 6, y + 4);

          if (isRunning) {
            p.angle += p.speed * speedMultiplier;
          }
        }
        requestAnimationFrame(render);
      }

      // Controles
      document.getElementById('planetSelect').addEventListener('change', (e) => {
        selectedPlanetId = e.target.value;
        if (selectedPlanetId !== 'all') {
          const p = celestialObjects.find(item => item.id === selectedPlanetId);
          if (p) openModal(p);
        } else {
          document.getElementById('infoModal').classList.add('hidden');
        }
      });

      document.getElementById('speedRange').addEventListener('input', (e) => speedMultiplier = parseFloat(e.target.value));
      document.getElementById('tiltRange').addEventListener('input', (e) => tiltFactor = e.target.value / 100);

      const pauseBtn = document.getElementById('pausePlayBtn');
      pauseBtn.addEventListener('click', () => {
        isRunning = !isRunning;
        pauseBtn.textContent = isRunning ? '⏸️ Pausa' : '▶ Reanudar';
        pauseBtn.classList.toggle('active', isRunning);
      });

      const orbitsBtn = document.getElementById('toggleOrbitsBtn');
      orbitsBtn.addEventListener('click', () => {
        showOrbits = !showOrbits;
        orbitsBtn.textContent = showOrbits ? '🌐 Órbitas' : '🌐 Ocultas';
        orbitsBtn.classList.toggle('active', showOrbits);
      });

      canvas.addEventListener('pointerdown', (e) => {
        const rect = canvas.getBoundingClientRect();
        const cx = e.clientX - rect.left;
        const cy = e.clientY - rect.top;
        celestialObjects.forEach(p => {
          const dist = p.id === 'sun' ? Math.hypot(cx - canvas.width/2, cy - canvas.height/2) : Math.hypot(cx - p.currentX, cy - p.currentY);
          if (dist < p.radius + 10) {
            selectedPlanetId = p.id;
            document.getElementById('planetSelect').value = p.id;
            openModal(p);
          }
        });
      });

      function openModal(p) {
        document.getElementById('modalTitle').textContent = p.name;
        document.getElementById('modalDesc').textContent = p.desc;
        document.getElementById('statDia').textContent = p.dia;
        document.getElementById('statDist').textContent = p.dist;
        document.getElementById('statOrb').textContent = p.orb;
        document.getElementById('statTemp').textContent = p.temp;
        document.getElementById('statComp').textContent = p.comp;
        document.getElementById('infoModal').classList.remove('hidden');
      }

      document.getElementById('closeModal').addEventListener('click', () => {
        document.getElementById('infoModal').classList.add('hidden');
        selectedPlanetId = 'all';
        document.getElementById('planetSelect').value = 'all';
      });

      render();
    });
  </script>
</body>
</html>
