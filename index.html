<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AstroSphere OS // Quantum Orbital HUD</title>
  <style>
    :root {
      --bg-core: #020617;
      --bg-card: rgba(15, 23, 42, 0.75);
      --surface: rgba(30, 41, 59, 0.5);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --neon-cyan: #00f2fe;
      --neon-blue: #4facfe;
      --border-glass: rgba(0, 242, 254, 0.2);
      --shadow-glow: 0 0 30px rgba(0, 242, 254, 0.25);
    }

    body.light-mode {
      --bg-core: #f1f5f9;
      --bg-card: rgba(255, 255, 255, 0.85);
      --surface: rgba(226, 232, 240, 0.6);
      --text-main: #0f172a;
      --text-muted: #475569;
      --neon-cyan: #0284c7;
      --neon-blue: #0369a1;
      --border-glass: rgba(2, 132, 199, 0.3);
      --shadow-glow: 0 0 30px rgba(2, 132, 199, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; transition: background 0.3s, color 0.3s, border 0.3s; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-core); color: var(--text-main); }

    .space-canvas-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at center, #0f172a 0%, var(--bg-core) 100%); }

    /* --- PANTALLA DE INICIO (SPLASH SCREEN ÉPICA) --- */
    #welcomeScreen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2, 6, 23, 0.94); backdrop-filter: blur(24px);
      z-index: 2000; display: flex; justify-content: center; align-items: center; padding: 20px;
    }
    body.light-mode #welcomeScreen { background: rgba(241, 245, 249, 0.94); }

    .welcome-container {
      background: var(--bg-card); border: 1px solid var(--border-glass);
      padding: 45px 35px; border-radius: 28px; text-align: center; max-width: 460px; width: 100%;
      box-shadow: var(--shadow-glow), 0 25px 50px rgba(0,0,0,0.6);
      animation: zoomIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative; overflow: hidden;
    }
    .welcome-container::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-blue));
    }

    .core-icon-glow {
      width: 70px; height: 70px; margin: 0 auto 20px auto;
      background: rgba(0, 242, 254, 0.08); border: 1px solid var(--neon-cyan);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 30px; box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
      animation: pulseGlow 2s infinite ease-in-out;
    }

    .welcome-container h1 { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 8px; }
    .welcome-container p { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 25px; }

    .enter-sys-btn {
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-blue));
      color: #020617; border: none; padding: 14px 24px; font-weight: 800; font-size: 14px;
      border-radius: 14px; cursor: pointer; width: 100%;
      box-shadow: 0 10px 25px rgba(0, 242, 254, 0.35);
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .enter-sys-btn:hover { transform: translateY(-2px); opacity: 0.95; }

    /* --- BARRA SUPERIOR HUD --- */
    .top-control-bar {
      position: fixed; top: 0; left: 0; width: 100%;
      background: var(--bg-card); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-glass);
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px; z-index: 100; gap: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .hud-brand { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 16px; letter-spacing: 0.5px; }
    .highlight { color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0,242,254,0.4); }

    .hud-controls-deck { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .hud-group { display: flex; flex-direction: column; gap: 3px; }
    .hud-label { font-size: 9px; color: var(--text-muted); font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; }

    .cyber-select, .cyber-btn {
      background: var(--surface); border: 1px solid var(--border-glass);
      color: var(--text-main); padding: 7px 12px; border-radius: 9px; font-size: 12px; font-weight: 600;
      cursor: pointer; outline: none;
    }
    .cyber-select:hover, .cyber-btn:hover { border-color: var(--neon-cyan); }
    .cyber-btn.active { background: rgba(0, 242, 254, 0.15); border-color: var(--neon-cyan); color: var(--neon-cyan); }

    .slider-box { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border-glass); padding: 5px 10px; border-radius: 9px; }
    .cyber-range { accent-color: var(--neon-cyan); cursor: pointer; height: 4px; width: 75px; }
    .hud-actions { display: flex; gap: 6px; }

    /* Viewport */
    .simulation-viewport { width: 100%; height: 100vh; }
    canvas { display: block; touch-action: none; }

    /* MODAL DE PLANETA */
    .info-modal {
      position: fixed; bottom: 24px; right: 24px; width: 360px; max-height: 82vh;
      background: var(--bg-card); backdrop-filter: blur(20px); border: 1px solid var(--border-glass);
      border-radius: 22px; padding: 22px; z-index: 200; box-shadow: 0 25px 50px rgba(0,0,0,0.5);
      overflow-y: auto; animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .info-modal.hidden { display: none !important; }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .modal-header h2 { font-size: 18px; font-weight: 900; }
    .close-btn { background: var(--surface); border: 1px solid var(--border-glass); color: var(--text-muted); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 14px; }
    .stat-box { background: var(--surface); border: 1px solid var(--border-glass); padding: 10px; border-radius: 10px; }
    .stat-box.full { grid-column: span 2; }
    .stat-box .label { display: block; font-size: 9px; color: var(--text-muted); font-weight: 800; text-transform: uppercase; margin-bottom: 2px; }
    .stat-box strong { font-size: 12px; color: var(--neon-cyan); font-weight: 800; }

    @keyframes zoomIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
